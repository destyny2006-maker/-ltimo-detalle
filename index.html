
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un mensaje entre las estrellas ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background: radial-gradient(ellipse at top, #17213e 0%, #080d20 55%, #02040d 100%);
    color: #fff;
    font-family: Georgia, serif;
}

#sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.moon {
    position: fixed;
    top: 45px;
    right: 35px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #fff4cf;
    box-shadow: 0 0 25px #fff0bd, 0 0 65px #d9c58b;
    z-index: 1;
}

.moon::after {
    content: "";
    position: absolute;
    top: -8px;
    left: 17px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #111a33;
}

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: 100vh;
    padding: 35px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.intro {
    animation: appear 2s ease;
}

h1 {
    color: #f5d98b;
    font-size: 30px;
    font-style: italic;
    font-weight: normal;
    text-shadow: 0 0 15px #d6a94e;
    margin-bottom: 18px;
}

.subtitle {
    color: #e8dcbf;
    font-size: 17px;
    font-style: italic;
    line-height: 1.7;
    margin-bottom: 30px;
}

button {
    border: 1px solid #e4c477;
    background: linear-gradient(135deg, #9b7130, #e6c879, #9b7130);
    color: #201507;
    padding: 13px 24px;
    border-radius: 30px;
    font-size: 16px;
    font-family: Georgia, serif;
    cursor: pointer;
    box-shadow: 0 0 20px #c69c4c66;
    transition: 0.3s;
}

button:active {
    transform: scale(0.95);
}

#messageArea {
    width: 100%;
    max-width: 600px;
    min-height: 230px;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

#message {
    width: 100%;
    color: #f5d78b;
    font-size: clamp(23px, 5vw, 31px);
    line-height: 1.65;
    font-style: italic;
    font-weight: normal;
    text-shadow:
        0 0 5px #e7c36e,
        0 0 14px #d5a94c,
        0 0 28px #b88b36;
    padding: 15px 5px;
    min-height: 100px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
}

#voiceButton {
    display: none;
    margin-top: 20px;
    animation: appear 1.5s ease;
}

#finalMessage {
    display: none;
    color: #f5d78b;
    font-size: clamp(23px, 5vw, 30px);
    line-height: 1.8;
    font-style: italic;
    text-shadow: 0 0 12px #d6a94e, 0 0 25px #b88b36;
    white-space: pre-line;
    animation: appear 3s ease;
    margin-top: 20px;
}

#heartCanvas {
    display: none;
    width: 260px;
    height: 210px;
    margin-top: 15px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width: 480px) {
    .moon {
        width: 48px;
        height: 48px;
        top: 25px;
        right: 22px;
    }

    .moon::after {
        width: 48px;
        height: 48px;
        left: 13px;
    }

    h1 {
        font-size: 26px;
    }

    #messageArea {
        min-height: 250px;
    }
}
</style>
</head>

<body>

<canvas id="sky"></canvas>
<div class="moon"></div>

<audio id="music" loop preload="auto">
    <source src="Wuicho Kun - Nubecita (Letra_Lyrics)(MP3_160K).mp3" type="audio/mpeg">
</audio>

<audio id="voice" preload="auto">
    <source src="Denoise_Mi último detalle.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <div class="intro" id="intro">
        <h1>Una última sorpresa para ti...</h1>

        <p class="subtitle">
            Antes de que termine esta noche,<br>
            quiero regalarte algo que viene<br>
            directamente de mi corazón. ❤️
        </p>

        <button onclick="startExperience()">
            Abrir mi último detalle ✨
        </button>
    </div>

    <div id="messageArea">
        <div id="message"></div>
    </div>

    <button id="voiceButton" onclick="playVoice()">
        ❤️ Escuchar mi voz ❤️
    </button>

    <div id="finalMessage">
Buenas noches, mi niña hermosa. ❤️

Si pudiera elegir dónde estar esta noche,
sería a tu lado.

Te amo ✨
    </div>

    <canvas id="heartCanvas" width="520" height="420"></canvas>

</div>

<script>
const music = document.getElementById("music");
const voice = document.getElementById("voice");
const intro = document.getElementById("intro");
const messageArea = document.getElementById("messageArea");
const message = document.getElementById("message");
const voiceButton = document.getElementById("voiceButton");
const finalMessage = document.getElementById("finalMessage");

const messages = [
    "De todas las estrellas del cielo,",
    "mi destino siempre sería encontrarte a ti.",
    "Si pudiera pedirles un deseo,",
    "sería que nunca te faltaran motivos para sonreír.",
    "Aunque nos separen kilómetros,",
    "mi corazón siempre encuentra el camino hacia ti.",
    "Hoy celebramos tu vida,",
    "pero yo agradezco cada día que formes parte de la mía.",
    "Y si esta noche miras al cielo,",
    "recuerda que en algún lugar hay alguien",
    "que piensa en ti, desea verte feliz",
    "y te quiere con todo su corazón.",
    "Feliz cumpleaños, mi niña hermosa ❤️"
];

const wait = (ms) =>
    new Promise(resolve => setTimeout(resolve, ms));

async function typeText(text) {
    message.textContent = "";

    for (let i = 0; i < text.length; i++) {
        message.textContent += text[i];

        let delay = text[i] === "," || text[i] === "." ? 180 : 65;
        await wait(delay);
    }
}

async function startExperience() {
    intro.style.display = "none";
    messageArea.style.display = "flex";

    music.volume = 0.65;
    music.play().catch(() => {
        alert("Toca nuevamente la pantalla para iniciar la música.");
    });

    for (let i = 0; i < messages.length; i++) {
        await typeText(messages[i]);
        await wait(2400);
    }

    messageArea.style.display = "none";
    voiceButton.style.display = "inline-block";
}

async function fadeOutMusic() {
    let startVolume = music.volume;

    for (let i = 0; i < 15; i++) {
        music.volume = Math.max(0, startVolume - startVolume * (i + 1) / 15);
        await wait(60);
    }

    music.pause();
    music.volume = 0.65;
}

async function playVoice() {
    voiceButton.style.display = "none";

    await fadeOutMusic();

    voice.currentTime = 0;
    voice.volume = 1;

    voice.play().catch(() => {
        alert("No se pudo reproducir tu grabación. Revisa que el archivo esté subido correctamente.");
        voiceButton.style.display = "inline-block";
    });
}

voice.addEventListener("ended", async () => {
    finalMessage.style.display = "block";
    document.getElementById("heartCanvas").style.display = "block";

    drawHeart();

    music.currentTime = 0;
    music.volume = 0;
    music.play().catch(() => {});

    for (let i = 0; i < 20; i++) {
        music.volume = Math.min(0.45, (i + 1) * 0.025);
        await wait(100);
    }
});

/* ESTRELLAS DEL CIELO */

const sky = document.getElementById("sky");
const ctx = sky.getContext("2d");

let stars = [];

function resizeSky() {
    sky.width = window.innerWidth * devicePixelRatio;
    sky.height = window.innerHeight * devicePixelRatio;

    sky.style.width = window.innerWidth + "px";
    sky.style.height = window.innerHeight + "px";

    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

    stars = [];

    for (let i = 0; i < 160; i++) {
        stars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 1.8 + 0.3,
            alpha: Math.random(),
            speed: Math.random() * 0.02 + 0.005
        });
    }
}

function animateSky() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    stars.forEach(star => {
        star.alpha += star.speed;

        if (star.alpha > 1 || star.alpha < 0.15) {
            star.speed *= -1;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${star.alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "white";
        ctx.fill();
    });

    requestAnimationFrame(animateSky);
}

window.addEventListener("resize", resizeSky);

resizeSky();
animateSky();

/* CORAZÓN FORMADO POR ESTRELLAS */

function drawHeart() {
    const canvas = document.getElementById("heartCanvas");
    const c = canvas.getContext("2d");

    let points = [];

    for (let t = 0; t < Math.PI * 2; t += 0.045) {
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t)
              - 5 * Math.cos(2 * t)
              - 2 * Math.cos(3 * t)
              - Math.cos(4 * t);

        points.push({
            x: 260 + x * 9,
            y: 205 - y * 9,
            size: Math.random() * 2 + 1
        });
    }

    let progress = 0;

    function animateHeart() {
        c.clearRect(0, 0, canvas.width, canvas.height);

        progress = Math.min(1, progress + 0.012);

        let count = Math.floor(points.length * progress);

        for (let i = 0; i < count; i++) {
            let p = points[i];

            c.beginPath();
            c.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            c.fillStyle = "#f5d78b";
            c.shadowBlur = 15;
            c.shadowColor = "#f5d78b";
            c.fill();
        }

        requestAnimationFrame(animateHeart);
    }

    animateHeart();
}
</script>

</body>
    </html>
